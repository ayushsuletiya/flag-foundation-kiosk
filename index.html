<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flag Foundation of India</title>
    <style>
      /* Boot splash — painted from the raw HTML BEFORE any JS/React loads, so a
         cold load (or the kiosk's first boot) shows the warm brand, never the
         black <body>. main.tsx fades it out once the app has painted. */
      html,
      body {
        background: #2a1a0e;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 42%, #e6ad6e 0%, #b3712f 48%, #6b401d 100%);
        color: #fff8ef;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        transition: opacity 420ms ease;
      }
      #boot-splash.boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-title {
        font-size: 4.4vw;
        letter-spacing: 0.5px;
        line-height: 1.1;
      }
      #boot-splash .boot-title em {
        font-style: italic;
        font-weight: 400;
      }
      #boot-splash .boot-of {
        font-size: 3vw;
        font-style: italic;
        opacity: 0.92;
        margin-top: 0.2em;
      }
      #boot-splash .boot-dots {
        margin-top: 2.4vw;
        display: flex;
        gap: 0.6vw;
      }
      #boot-splash .boot-dots span {
        width: 0.7vw;
        height: 0.7vw;
        border-radius: 50%;
        background: #fff8ef;
        opacity: 0.35;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) {
        animation-delay: 0.18s;
      }
      #boot-splash .boot-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <div class="boot-title"><em>The</em> Flag Foundation</div>
      <div class="boot-of">of India</div>
      <div class="boot-dots"><span></span><span></span><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
