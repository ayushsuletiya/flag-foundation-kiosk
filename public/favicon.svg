<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Flag of India">
  <title>Flag of India</title>
  <!-- Tiranga — three equal horizontal bands -->
  <rect x="0" y="0" width="512" height="170.667" fill="#FF9933"/>
  <rect x="0" y="170.667" width="512" height="170.666" fill="#FFFFFF"/>
  <rect x="0" y="341.333" width="512" height="170.667" fill="#138808"/>
  <!-- Ashoka Chakra (navy blue #000080), centred in the white band -->
  <g stroke="#000080" fill="none">
    <circle cx="256" cy="256" r="78" stroke-width="5"/>
    <circle cx="256" cy="256" r="66" stroke-width="2"/>
    <g stroke-width="2.6" stroke-linecap="round">
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(0 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(15 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(30 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(45 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(60 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(75 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(90 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(105 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(120 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(135 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(150 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(165 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(180 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(195 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(210 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(225 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(240 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(255 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(270 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(285 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(300 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(315 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(330 256 256)"/>
      <line x1="256" y1="256" x2="256" y2="180" transform="rotate(345 256 256)"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="12" fill="#000080"/>
</svg>
